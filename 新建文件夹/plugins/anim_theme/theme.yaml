Sylvia:
  # Specal
  window_titlebar_background_color: 0x00E8FDFF  # 窗口标题栏背景颜色（COLORREF）
  background_images: "D:/Find-A-Way-VII/新建文件夹/plugins/anim_theme/images/background_sylvia.png"  # 背景图片
  background_filter_color: rgba(255, 252, 209, 0.6)  # 背景滤镜颜色
  dock_close_button_url: ":/ads/images/close-button.svg"  # dock 关闭按钮图标
  dock_close_button_disabled_url: ":/ads/images/close-button-disabled.svg"  # dock 禁用的关闭按钮的图标

  # Base
  background_color: "#FFFCD1"  # 主背景颜色
  surface_color: "#FFFDE8"  # 面板/表面背景颜色
  card_color: "#F5F2D5"  # 卡片背景颜色
  element_color: "#EAE6C5"  # 控件元素背景颜色

  # Text
  text_color: "#303020"  # 主文本颜色
  secondary_text_color: "#707050"  # 次要文本颜色
  disabled_text_color: "#AAA88C"  # 禁用状态文本颜色

  # Border
  border_color: "#000000"  # 边框颜色

  # Accent
  theme_color: "#D6B84C"  # 主题强调色
  theme_color_hover: "#E2C866"  # 悬停状态主题色
  theme_color_pressed: "#B89A35"  # 按下状态主题色
  theme_color_disabled: "#C8BD80"  # 禁用状态主题色

