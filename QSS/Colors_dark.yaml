# =====================================================================
#  Colors_dark.yaml  —  深色主题颜色配置
# =====================================================================
# [说明] 此文件与 color_loader.py 中的默认值保持同步。
#        当在 Python 中新增颜色字段时，应同步更新本文件。
# [格式] rgba 颜色 → rgba(R, G, B, A)
#        十六进制  → '#RRGGBB'（需加引号，否则 # 被视为注释）
# =====================================================================

# ----------------- 窗口的基本设置 ----------------------------------------
window_base:
  window_background_color: rgba(64, 64, 64, 255)          # 窗口背景色
  background_filter_color: rgba(0, 0, 0, 0.85)             # 背景滤镜色（模态框遮罩）
  text_color: rgba(255, 255, 255, 255)                    # 默认文字颜色
  button_hover_color: rgba(255, 255, 255, 64)             # 普通按钮悬停色
  button_pressed_color: rgba(255, 255, 255, 128)          # 普通按钮按下的颜色
  close_button_hover_color: rgba(240, 62, 62, 255)        # 关闭按钮悬停色
  close_button_pressed_color: rgba(189, 48, 48, 255)      # 关闭按钮按下的颜色

# ----------------- 对话窗口设置 ------------------------------------------
chat_window:
  general_split_line_color: rgba(255, 255, 255, 192)      # 全局分割线颜色

  input_area_backgournd_color: rgba(255, 255, 255, 16)    # 输入框背景颜色
  input_area_boarder_color: rgba(255, 255, 255, 255)       # 输入框边框颜色
  input_button_background_color: rgba(255, 255, 255, 64)  # 按钮背景颜色
  input_button_boarder_color: rgba(255, 255, 255, 0)     # 按钮边框颜色
  input_button_hover_background_color: rgba(50, 50, 100, 128)           # 发送按钮悬停颜色
  input_button_pressed_background_color: rgba(50, 50, 100, 255)         # 发送按钮按下颜色
  conversion_item_editing_background_color: rgba(255, 255, 255, 64)  # 对话条目编辑背景色
  conversion_item_reasoning_content_color: '#DDDDDD'                   # 对话条目思考文字颜色

  role_label_text_color: '#DDDDDD'                         # 角色标签文字颜色

  input_button_color: '#303030'                            # 输入按钮颜色

  role_user_color: '#C4A84A'                               # 用户角色颜色
  role_assistant_color: '#7E9BB5'                          # 助手角色颜色
  role_tool_color: '#8AA38D'                               # 工具角色颜色
  role_system_color: '#A8A8A8'                             # 系统角色颜色
  role_error_color: '#FFB0B0'                              # 错误角色颜色
  role_line_color: '#FFFFFF'                               # 角色分割线颜色

  float_window_background_color: '#000000'                 # 浮动窗口背景色
  float_window_background_alpha: 128                       # 浮动窗口背景透明度 (0-255)
  float_window_shadow_start_alpha: 40                      # 浮动窗口阴影起始透明度
