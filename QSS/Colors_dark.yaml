# =====================================================================
#  Colors_dark.yaml  —  深色主题颜色配置
# =====================================================================
# [说明] 此文件与 color_loader.py 中的默认值保持同步。
#        当在 Python 中新增颜色字段时，应同步更新本文件。
# [格式] rgba 颜色 → rgba(R, G, B, A)
#        十六进制  → '#RRGGBB'（需加引号，否则 # 被视为注释）
# =====================================================================

# ----------------- 窗口的基本设置 ----------------------------------------
window_base:
  window_background_color: '#080810'          # 窗口背景色
  background_filter_color: rgba(0, 0, 0, 0.75)             # 背景滤镜色
  default_text_color: '#f0f0ff'                    # 默认文字颜色
  titlebar_button_hover_color: '#202040'             # 普通标题栏按钮悬停色
  titlebar_button_pressed_color: '#46468c'          # 普通标题栏按钮按下的颜色
  close_button_hover_color: rgba(240, 62, 62, 255)        # 关闭按钮悬停色
  close_button_pressed_color: rgba(189, 48, 48, 255)      # 关闭按钮按下的颜色


# ----------------- 对话窗口设置 ------------------------------------------
chat_window:
  general_split_line_color: '#c0c0ff'      # 全局分割线颜色

  input_area_backgournd_color: rgba(32, 32, 64, 0.5)    # 输入框背景颜色
  input_area_boarder_color: rgba(0, 0, 0, 0)       # 输入框边框颜色
  input_button_background_color: rgba(64, 64, 128, 0.5)  # 输入按钮背景颜色
  input_button_boarder_color: rgba(0, 0, 0, 0)     # 输入按钮边框颜色
  input_button_hover_background_color: rgba(128, 128, 255, 0.5)           # 输入按钮悬停颜色
  input_button_pressed_background_color: rgba(128, 128, 255, 1)         # 输入按钮按下颜色

  conversion_item_editing_background_color: rgba(128, 128, 255, 0.25)  # 对话条目编辑背景色
  conversion_item_reasoning_content_color: rgb(224, 224, 255)                   # 对话条目思考文字颜色

  role_user_normal_color: '#C0C080'                               # 用户角色颜色
  role_assistant_normal_color: '#8080C0'                          # 助手角色颜色
  role_tool_normal_color: '#80C080'                               # 工具角色颜色
  role_system_normal_color: '#C0C0C0'                             # 系统角色颜色
  role_error_normal_color: '#C08080'                              # 错误角色颜色

  role_user_extra_color: '#808040'                               # 用户角色颜色
  role_assistant_extra_color: '#404080'                          # 助手角色颜色
  role_tool_extra_color: '#408040'                               # 工具角色颜色
  role_system_extra_color: '#404040'                             # 系统角色颜色
  role_error_extra_color: '#804040'                              # 错误角色颜色

  float_window_background_color: '#101020'                 # 浮动窗口背景色
  float_window_background_alpha: 128                       # 浮动窗口背景透明度 (0-255)
  float_window_shadow_start_alpha: 40                      # 浮动窗口阴影起始透明度
  float_window_split_color: rgba(240, 240, 255, 128)
  float_window_button_text_color: rgba(240, 240, 255, 1)
  float_window_button_hover_color: rgba(240, 240, 255, 64)
  float_window_button_pressed_color: rgba(240, 240, 255, 128)

  conversion_item_button_hover_color: rgba(240, 240, 255, 64)
  conversion_item_button_pressed_color: rgba(240, 240, 255, 128)

  title_edit_background_color: rgba(240, 240, 255, 0.25)
  
  state_label_background_color: rgba(240, 240, 255, 64)
  state_label_hover_color: rgba(240, 240, 255, 128)
  state_idle_color: "#FFF"
  state_transport_color: "#AFA"
  state_connect_color: "#FFA"

  work_path_color: rgba(240, 240, 255, 64)

  tree_line_color: '#404080'  